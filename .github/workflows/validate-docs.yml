name: Part 1 - Validate Planning Documents

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  validate-docs:
    name: Validate /docs folder structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::/docs folder is missing from the repository root."
            exit 1
          fi
          echo "/docs folder found."
          echo "Contents of /docs:"
          ls -la docs

      - name: Check for at least one PDF or image (ERD)
        run: |
          shopt -s nullglob
          matches=(docs/*.pdf docs/*.png docs/*.jpg docs/*.jpeg)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::No ERD/plan document (PDF, PNG, or JPG) found in /docs."
            exit 1
          fi
          echo "Found document(s): ${matches[*]}"

      - name: Check for at least 2 PDF/image docs (ERD + Endpoint Plan)
        run: |
          shopt -s nullglob
          matches=(docs/*.pdf docs/*.png docs/*.jpg docs/*.jpeg)
          if [ ${#matches[@]} -lt 2 ]; then
            echo "::error::Expected at least 2 planning documents (ERD and API Endpoint Plan) in /docs, found ${#matches[@]}."
            exit 1
          fi
          echo "Found ${#matches[@]} document(s): ${matches[*]}"

      - name: Check for SQL database script
        run: |
          shopt -s nullglob
          matches=(docs/*.sql)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::No .sql database script found in /docs."
            exit 1
          fi
          echo "SQL script found: ${matches[0]}"

      - name: Check README exists at repository root
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: Summary
        run: echo "All required Part 1 planning documents are present. ✅"
